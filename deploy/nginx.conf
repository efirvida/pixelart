# PixelArt Image Reducer — Nginx reverse-proxy configuration
#
# Serves the React frontend from the build output and proxies API
# requests to the uvicorn backend on localhost:8000.
#
# Deploy:
#   1. Copy this file to /etc/nginx/sites-available/pixelart
#   2. Symlink: ln -s /etc/nginx/sites-available/pixelart /etc/nginx/sites-enabled/
#   3. Test:    nginx -t
#   4. Reload:  systemctl reload nginx

server {
    listen 80;
    server_name _;  # Replace with your domain or IP

    # ------------------------------------------------------------------
    # Frontend — static files from the Vite/React build
    # ------------------------------------------------------------------
    root /var/www/pixelart/frontend/dist;
    index index.html;

    # Serve frontend static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------
    # Backend API — proxy to uvicorn
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for image processing (up to 30 s)
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;

        # Increase upload size limit (default 1 MB is too small)
        client_max_body_size 15m;
    }

    # ------------------------------------------------------------------
    # Security & performance
    # ------------------------------------------------------------------
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Basic security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
}
