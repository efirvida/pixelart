# PixelArt Image Reducer — Nginx reverse-proxy configuration
#
# Serves the React frontend from the build output and proxies API
# requests to the uvicorn backend on localhost:8000.
#
# Deploy:
#   1. sudo cp deploy/nginx.conf /etc/nginx/sites-available/pixelart.conf
#   2. sudo ln -sf /etc/nginx/sites-available/pixelart.conf /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8080;
    server_name pixelart.firvida.org 190.15.151.199;

    root /opt/pixelart/repo/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        client_max_body_size 15m;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
}

