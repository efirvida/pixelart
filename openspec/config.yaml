# openspec/config.yaml
schema: spec-driven

context: |
  Project: pixelArt — a pixel art creation/editing tool
  Stack: not yet initialized (empty project)
  Architecture: not yet established
  Testing: no test runner available
  Style: not yet established

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
