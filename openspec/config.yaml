# openspec/config.yaml
schema: spec-driven

context: |
  Project: pixelArt — a pixel art creation/editing tool
  Stack: React 19 + TypeScript + Vite 8 (frontend only for this session)
  Architecture: Feature-based layout with context-driven state (GridContext)
  Testing: Vitest 4 + @testing-library/react 16
  Style: Raw inline styles (no CSS framework, no CSS modules, no CSS-in-JS)

session_config:
  artifact_store_mode: openspec
  execution_mode: auto
  delivery_strategy: single-pr
  review_budget_lines: 800

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns when they emerge
    tdd: true
    test_command: "cd frontend && npx vitest run --reporter=verbose"
  verify:
    test_command: "cd frontend && npx vitest run --reporter=verbose"
    build_command: "cd frontend && npx tsc --noEmit && npx vite build"
    coverage_threshold: 0

testing:
  strict_tdd: true
  detected: "2026-07-27"
  runner: vitest (v4.1.10)
  layers:
    unit:
      available: true
      tool: vitest + @testing-library/react
    integration:
      available: true
      tool: vitest + renderWithProvider (GridProvider wrapper)
    e2e:
      available: false
      tool: null
  coverage:
    available: true
    command: "cd frontend && npx vitest run --coverage"
  quality:
    linter:
      available: false
      command: null
    type_checker:
      available: true
      command: "cd frontend && npx tsc --noEmit"
    formatter:
      available: false
      command: null
