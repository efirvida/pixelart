[project]
name = "pixelart-backend"
version = "0.1.0"
description = "Image Pixel Reducer — backend API and core processing"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0,<0.116.0",
    "uvicorn>=0.20.0,<0.40.0",
    "pillow>=10.0.0,<12.0.0",
    "numpy>=1.24.0,<2.0.0",
    "colour-science>=0.4.4,<0.4.7",
    "reportlab>=4.0.0",
    "python-multipart>=0.0.5,<0.0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
