[project]
name = "pixelart-backend"
version = "0.1.0"
description = "Image Pixel Reducer — backend API and core processing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.2",
    "uvicorn>=0.51.0",
    "pillow>=12.3.0",
    "numpy>=2.5.1",
    "colour-science>=0.4.7",
    "reportlab>=5.0.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
